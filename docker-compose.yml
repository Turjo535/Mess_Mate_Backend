services:
  redis:
    image: redis:7-alpine
    container_name: mess_mate_redis
    restart: unless-stopped
    networks:
      - mess_mate_network

  db:
    image: postgres:16-alpine
    container_name: mess_mate_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: Mess_Mate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Mess_Mate
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Mess_Mate"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mess_mate_network

  web:
    build: .
    container_name: mess_mate_web
    user: "${HOST_UID}:${HOST_GID}"
    restart: unless-stopped
    command: >
      bash -c "python manage.py migrate &&
               python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOME=/tmp
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - mess_mate_network

  celery:
    build: .
    container_name: mess_mate_celery
    user: "${HOST_UID}:${HOST_GID}"
    restart: unless-stopped
    command: celery -A Mess_Mate_Project worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - HOME=/tmp
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - mess_mate_network

  beat:
    build: .
    container_name: mess_mate_beat
    user: "${HOST_UID}:${HOST_GID}"
    restart: unless-stopped
    command: celery -A Mess_Mate_Project beat --loglevel=info --schedule /tmp/celerybeat-schedule
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - HOME=/tmp
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - mess_mate_network

networks:
  mess_mate_network:
    driver: bridge

volumes:
  postgres_data: