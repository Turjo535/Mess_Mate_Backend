services:
  db:
    image: postgres:16-alpine
    container_name: mess_mate_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: Mess_Mate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Mess_Mate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Mess_Mate"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mess_mate_network

  web:
    build: .
    container_name: mess_mate_web
    restart: unless-stopped
    command: >
      bash -c "python manage.py makemigrations &&
               python manage.py migrate &&
               python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mess_mate_network

networks:
  mess_mate_network:
    driver: bridge

volumes:
  postgres_data: